[project]
name = "cwdiary"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<3.2",
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
  "Pillow>=10,<13",
  "opencc-python-reimplemented==0.1.7",
]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
